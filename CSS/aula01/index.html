<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>
    <!-- CSS embedd (embutido) -->
    <style>
        p {
            font-size: 100px;
        }

        #gato {
            color: yellowgreen;
        }

        #cachorro {
            color: maroon;
        }
    </style>
</head>

<body>
    <!-- CSS inline é aquele que vai dentro da própria tag -->
    <p style="color: rebeccapurple; font-size: 50px;">Pedro</p>
    <p id="cachorro">Jake</p>
    <p id="gato">Miguel</p>
</body>

</html>
